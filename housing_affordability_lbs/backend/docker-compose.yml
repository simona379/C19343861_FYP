version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: housing_database
    env_file:
      - .env
    ports:
      - "5433:5432"     # host:container  (for connecting with pgAdmin)
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: housing_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: housing_frontend
    working_dir: /app
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      - web

volumes:
  pgdata:
  node_modules:

